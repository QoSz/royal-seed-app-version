name: Update version.json

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read store versions
        run: ./update.sh

      - name: Commit if changed
        if: always()
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update version.json"
          git push

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling on every run resets that timer.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
